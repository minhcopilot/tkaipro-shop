# Cài vào /etc/nginx/conf.d/tkaipro-shop-security.conf (http context).
#
# Zone rate-limit RIÊNG cho shop TKAIPro. Nếu dùng chung zone với shop khác
# thì lượt đặt đơn của shop này sẽ ăn vào hạn mức của shop kia.
#
# Các thứ dùng chung (set_real_ip_from của Cloudflare, geo $bad_ip) đã khai báo
# ở /etc/nginx/conf.d/cursor-order-security.conf — không lặp lại ở đây vì
# khai báo trùng trong cùng http context sẽ làm nginx báo lỗi.

limit_req_zone $binary_remote_addr zone=tkaipro_orders:10m rate=10r/m;
