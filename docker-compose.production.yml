services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* phải có mặt lúc BUILD (Next nhúng vào bundle), khác với
      # secret phía server chỉ cần lúc chạy. Đổi các giá trị này thì phải
      # rebuild, restart không đủ.
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
        NEXT_PUBLIC_SITE_FULL_NAME: ${NEXT_PUBLIC_SITE_FULL_NAME}
        NEXT_PUBLIC_SUPPORT_TELEGRAM: ${NEXT_PUBLIC_SUPPORT_TELEGRAM}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL}
        NEXT_PUBLIC_SUPPORT_MESSENGER: ${NEXT_PUBLIC_SUPPORT_MESSENGER}
        NEXT_PUBLIC_SUPPORT_FACEBOOK: ${NEXT_PUBLIC_SUPPORT_FACEBOOK}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        NEXT_PUBLIC_INDEXNOW_KEY: ${NEXT_PUBLIC_INDEXNOW_KEY}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION}
    restart: unless-stopped
    ports:
      # SECURITY: chỉ bind localhost — nginx (host) proxy qua 127.0.0.1:3003.
      # 3000=cursor-pro-shop, 3002=figma-shop; mỗi shop một cổng riêng.
      - "127.0.0.1:3003:3000"
    # VPS 4GB chạy nhiều shop: giới hạn để một shop leak memory không kéo sập
    # shop khác. 768m đủ cho Next standalone (thực tế idle ~350MB).
    mem_limit: 768m
    mem_reservation: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 180s
    # Secrets (DATABASE_URL, AUTH_*, BREVO_*, SePay, …) đến từ env_file —
    # không bao giờ commit plaintext secret vào file này.
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - NEXT_SERVER_APP_URL=${NEXT_PUBLIC_BASE_URL}
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    networks:
      # Mạng dùng chung với container `postgres` standalone (tạo ngoài compose).
      # Nhờ vậy app nối tới DB bằng hostname `postgres:5432` mà không phải mở
      # cổng Postgres ra host.
      - app-network

networks:
  app-network:
    external: true
